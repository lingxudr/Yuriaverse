name: Manga Scraper Schedule

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-manga:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        run: npm install axios cheerio --no-save

      - name: Run manga scraper
        run: node scripts/scraper.js

      - name: Commit latest manga JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest-manga.json
          if git diff --cached --quiet; then
            echo "No manga data changes to commit."
          else
            git commit -m "chore: update latest manga data"
            git push
          fi
